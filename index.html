<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #f0f4f8, #d9e2ec);
      margin: 0;
      padding: 40px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
    }
    input, button {
      padding: 12px;
      margin: 10px 0;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background-color: #3498db;
      color: white;
      font-weight: bold;
      transition: background 0.3s ease;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
    .summary {
      background-color: #ecf0f1;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }
    th, td {
      border: 1px solid #bdc3c7;
      padding: 12px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #2980b9;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .download-btn {
      margin-top: 20px;
      background-color: #27ae60;
    }
    .download-btn:hover {
      background-color: #1e8449;
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: -8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Loan Calculator</h1>
    <div>
      <input type="number" id="loanAmount" placeholder="Loan Amount" />
      <div id="loanAmountError" class="error"></div>
      <input type="number" id="tenure" placeholder="Tenure (months)" />
      <div id="tenureError" class="error"></div>
      <input type="number" id="interestRate" placeholder="Interest Rate (Annual %)" step="0.01" />
      <div id="interestRateError" class="error"></div>
      <input type="date" id="startDate" placeholder="Start Date" />
      <div id="startDateError" class="error"></div>
      <input type="number" id="prepayment" placeholder="Prepayment Amount (optional)" />
      <button onclick="calculateLoan()">Calculate</button>
      <button class="download-btn" onclick="downloadPDF()">Download PDF</button>
    </div>

    <div class="summary" id="summary"></div>

    <table id="schedule">
      <thead>
        <tr>
          <th>EMI No.</th>
          <th>Date</th>
          <th>Principal</th>
          <th>Interest</th>
          <th>Remaining Principal</th>
          <th>Prepayment</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    function clearErrors() {
      ['loanAmountError', 'tenureError', 'interestRateError', 'startDateError'].forEach(id => {
        document.getElementById(id).innerText = '';
      });
    }

    function calculateLoan() {
      clearErrors();

      const loanAmount = parseFloat(document.getElementById('loanAmount').value);
      const tenure = parseInt(document.getElementById('tenure').value);
      const annualRate = parseFloat(document.getElementById('interestRate').value);
      const startDateValue = document.getElementById('startDate').value;
      const prepayment = parseFloat(document.getElementById('prepayment').value) || 0;

      let hasError = false;

      if (!loanAmount || loanAmount <= 0) {
        document.getElementById('loanAmountError').innerText = 'Enter a valid loan amount';
        hasError = true;
      }
      if (!tenure || tenure <= 0) {
        document.getElementById('tenureError').innerText = 'Enter a valid tenure';
        hasError = true;
      }
      if (!annualRate || annualRate <= 0) {
        document.getElementById('interestRateError').innerText = 'Enter a valid interest rate';
        hasError = true;
      }
      if (!startDateValue) {
        document.getElementById('startDateError').innerText = 'Select a valid start date';
        hasError = true;
      }

      if (hasError) return;

      const startDate = new Date(startDateValue);
      const monthlyRate = annualRate / 12 / 100;
      const emi = loanAmount * monthlyRate * Math.pow(1 + monthlyRate, tenure) / (Math.pow(1 + monthlyRate, tenure) - 1);

      let balance = loanAmount;
      let totalInterest = 0;
      const tbody = document.querySelector('#schedule tbody');
      tbody.innerHTML = '';

      for (let i = 1; i <= tenure; i++) {
        const interest = balance * monthlyRate;
        const principal = Math.min(emi - interest, balance);
        totalInterest += interest;

        let prepayAmount = 0;
        if (i === 1 && prepayment > 0) {
          prepayAmount = Math.min(prepayment, balance - principal);
          balance -= prepayAmount;
        }

        balance -= principal;

        const emiDate = new Date(startDate);
        emiDate.setMonth(startDate.getMonth() + i - 1);
        const formattedDate = emiDate.toISOString().split('T')[0];

        const row = `<tr>
          <td>${i}</td>
          <td>${formattedDate}</td>
          <td>${principal.toFixed(2)}</td>
          <td>${interest.toFixed(2)}</td>
          <td>${Math.max(balance, 0).toFixed(2)}</td>
          <td>${prepayAmount > 0 ? prepayAmount.toFixed(2) : '-'}</td>
        </tr>`;

        tbody.innerHTML += row;

        if (balance <= 0.01) break;
      }

      document.getElementById('summary').innerHTML = `
        Monthly EMI: <strong>${emi.toFixed(2)}</strong><br>
        Total Interest: <strong>${totalInterest.toFixed(2)}</strong><br>
        Total Repayment: <strong>${(emi * tenure + prepayment).toFixed(2)}</strong>
      `;
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text('Loan Amortization Schedule', 10, 10);

      const summaryText = document.getElementById('summary').innerText.split('\n');
      summaryText.forEach((line, idx) => {
        doc.text(line, 10, 20 + idx * 10);
      });

      doc.autoTable({
        html: '#schedule',
        startY: 50,
        theme: 'grid',
        headStyles: { fillColor: [41, 128, 185] }
      });

      doc.save('Loan_Amortization_Schedule.pdf');
    }
  </script>
</body>
</html>
